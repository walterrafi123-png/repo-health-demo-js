name: Repo Health Radar

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: walterrafi123-png/repo-health-radar@main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          min-score: "50"
          format: both
          markdown-file: repo-health-radar.md
          json-file: repo-health-radar.json
